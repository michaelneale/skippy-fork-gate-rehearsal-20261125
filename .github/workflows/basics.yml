name: Disposable basics
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  basics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile and run the complete synthetic test
        env:
          FORK: ${{ github.event.pull_request.head.repo.id != github.event.repository.id }}
          SYNTHETIC_SECRET: ${{ secrets.REHEARSAL_CANARY }}
        run: |
          if [ "$FORK" = true ]; then
            test -z "$SYNTHETIC_SECRET"
            echo 'Fork received no repository secret.'
          fi
          cc -Wall -Wextra -Werror sum.c -o "$RUNNER_TEMP/sum"
          test "$("$RUNNER_TEMP/sum")" = 42
          echo 'Disposable compile and test passed.'
